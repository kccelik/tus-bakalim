<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Şifre değiştir · TusBakalım</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
  <form method="post" class="w-full max-w-sm bg-white rounded-2xl shadow p-8 space-y-5">
    <div class="text-center">
      <h1 class="text-2xl font-bold text-slate-800">Şifre değiştir</h1>
      <p class="text-sm text-slate-500 mt-1">Sana verilen şifreyi kendi şifrenle değiştir</p>
    </div>

    {% if error %}
    <div class="rounded-lg bg-red-50 text-red-700 text-sm px-3 py-2">{{ error }}</div>
    {% endif %}
    {% if message %}
    <div class="rounded-lg bg-green-50 text-green-700 text-sm px-3 py-2">{{ message }}</div>
    {% endif %}

    <label class="block">
      <span class="text-sm font-medium text-slate-700">Kullanıcı adı</span>
      <input name="username" autocomplete="username" autocapitalize="none" required
             class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </label>
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Mevcut şifre</span>
      <input name="old_password" type="password" autocomplete="current-password" required
             class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </label>
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Yeni şifre</span>
      <input name="new_password" type="password" autocomplete="new-password" minlength="6" required
             class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </label>
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Yeni şifre (tekrar)</span>
      <input name="new_password2" type="password" autocomplete="new-password" minlength="6" required
             class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </label>

    <button class="w-full rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5">
      Şifreyi değiştir
    </button>
    <p class="text-center text-sm">
      <a href="/login" class="text-indigo-600 hover:underline">← Girişe dön</a>
    </p>
  </form>
</body>
</html>
